# Lambda Barre — example configuration
#
# Copy this file to config.toml and edit the values you want to change:
#   cp config.example.toml config.toml
#
# Precedence: CLI arguments > config.toml > built-in defaults.
# Any key omitted from config.toml falls back to the built-in default.

# ---------------------------------------------------------------------------
# World Model transformer architecture
# ---------------------------------------------------------------------------
[transformer]
d_model   = 64    # latent dimension (must be divisible by nhead)
nhead     = 4     # number of attention heads
layers    = 3     # number of transformer encoder layers
dim_ff    = 384   # feed-forward hidden dimension (typically 4-6x d_model)
dropout   = 0.05  # light dropout during WM training (0 = disabled; only active during training)

# ---------------------------------------------------------------------------
# Policy network architecture
# ---------------------------------------------------------------------------
[policy]
hidden    = 256   # width of each hidden layer (3 hidden layers)

# ---------------------------------------------------------------------------
# Optimizer and exploration hyperparameters
# ---------------------------------------------------------------------------
[training]
lr_wm            = 3.0e-4   # World Model learning rate (Adam)
lr_pol           = 2.0e-4   # Policy learning rate (Adam)
act_std          = 0.0      # action sampling std during wake (0 = no noise)
act_conseq_shift = 1        # manual mode: pair (s_{n-k}, a_n) to cancel human reaction latency (0 in brain-on)

# Sleep cycle training
wm_coreset_epoch   = 300    # World Model training epochs per sleep cycle (Coreset phase)
wm_addendum_epoch  = 300    # World Model training epochs per sleep cycle (Addendum phase)
wm_batch           = 64     # World Model training batch size
wm_target_loss     = 0.004  # early-stop target loss for WM training (overtime palier)
pol_steps          = 256    # Policy training steps per sleep cycle

# Outcome (EOS) & MDN head
eos_decay        = 0.8706   # EOS integral decay: 0.25^(1/lookahead) = 0.25^(1/10)
eos_n_modes      = 8        # number of Gaussian mixture components in the MDN EOS head
eos_sigma_min    = 0.02     # std floor for MDN components
eos_nll_w        = 0.1      # weight of shifted per-slot MDN NLL (>= 0) in WM loss
eos_temperature  = 1.0      # softmax temperature on MDN mixture logits at election
eos_top_p        = 0.9      # nucleus cumulative mass on MDN modes
eos_min_p        = 1.0e-3   # minimum probability floor for an eligible mode
wm_impact_floor  = 0.10     # additive floor on per-sequence impact |relief|
wm_input_noise   = 0.015    # light Gaussian noise on valid signal slots during training (prefix/padding/intero/EOS intact)

# ---------------------------------------------------------------------------
# Experience buffer capacities (in number of sequences)
# ---------------------------------------------------------------------------
[buffer]
capacity        = 1000   # session journal: max extractable sequences during wake
pool_capacity   = 1000   # coreset: max long-term consolidated sequences
dedup_eps       = 0.02   # RMSE threshold over full sequence (context + EOS + consequence + action); 0 = off
vivacity_decay  = 0.95   # per-sleep multiplicative decay of coreset vivacity (1.0 = no decay)

# ---------------------------------------------------------------------------
# Sequence geometry
# ---------------------------------------------------------------------------
[sequence]
seq_steps = 12   # consecutive salves in the window (s0..s11)
n_ctx     = 6    # decision context length (must be strictly less than seq_steps)
lookahead = 10   # jump of the last salve: s_{n_ctx+lookahead} (far outcome, close future learned)
wm_hz     = 4    # World Model recording cadence (Hz)
pol_hz    = 8    # Policy cadence (Hz, typically 2x wm_hz)

# ---------------------------------------------------------------------------
# Runtime options
# ---------------------------------------------------------------------------
[runtime]
device      = "cpu"     # cpu | cuda | auto | cpu-fast
accel       = false     # true = auto (CUDA if available, else CPU)
seed        = 0         # random seed (0 = default)
compile_wm  = false     # torch.compile the WM training step
no_smooth   = false     # bypass IIR sensor smoother (use raw snapshots)

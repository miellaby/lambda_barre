# Lambda Barre — example configuration
#
# Copy this file to config.toml and edit the values you want to change:
#   cp config.example.toml config.toml
#
# Precedence: CLI arguments > config.toml > built-in defaults.
# Any key omitted from config.toml falls back to the built-in default.

# ---------------------------------------------------------------------------
# World Model transformer architecture
# ---------------------------------------------------------------------------
[transformer]
d_model   = 64    # latent dimension (must be divisible by nhead)
nhead     = 4     # number of attention heads
layers    = 3     # number of transformer encoder layers
dim_ff    = 384   # feed-forward hidden dimension (typically 4-6x d_model)
dropout   = 0.0   # dropout rate (0 = disabled; only active during training)

# ---------------------------------------------------------------------------
# Policy network architecture
# ---------------------------------------------------------------------------
[policy]
hidden    = 256   # width of each hidden layer (3 hidden layers)

# ---------------------------------------------------------------------------
# Optimizer and exploration hyperparameters
# ---------------------------------------------------------------------------
[training]
lr_wm         = 3.0e-4   # World Model learning rate (Adam)
lr_pol        = 2.0e-4   # Policy learning rate (Adam)
act_std       = 0.05     # action sampling std during wake (exploitation)

# Sleep cycle training
wm_coreset_epoch   = 512    # World Model training epochs per sleep cycle (Coreset phase)
wm_addendum_epoch  = 128    # World Model training epochs per sleep cycle (Addendum phase)
wm_batch        = 64     # World Model training batch size
wm_target_loss  = 0.01   # early-stop target loss for WM coreset training
pol_steps       = 32     # Policy training steps per sleep cycle
eos_force_eps_lo = 0.15  # hindsight forcing: lower bound of eps ~ U(lo, hi)
eos_force_eps_hi = 0.40  # hindsight forcing: upper bound of eps ~ U(lo, hi)
eos_force_amplify = 1.0  # hindsight action amplification toward extremes (1.0 = off)
wm_impact_floor  = 0.25   # additive floor on the per-sequence impact weight (impact/neutral contrast ~3x at relief 0.5)

# ---------------------------------------------------------------------------
# Experience buffer capacities (in number of sequences)
# ---------------------------------------------------------------------------
[buffer]
capacity        = 1000   # session journal: max extractable sequences during wake
pool_capacity   = 1000   # coreset: max long-term consolidated sequences

# ---------------------------------------------------------------------------
# Sequence geometry
# ---------------------------------------------------------------------------
[sequence]
seq_steps = 10   # number of transitions (salves) per training sequence
n_ctx     = 4    # decision context length — must be strictly less than seq_steps
                 # The policy decides at step n_ctx; consequences are evaluated
                 # from n_ctx+1 to seq_steps.

# ---------------------------------------------------------------------------
# Runtime options
# ---------------------------------------------------------------------------
[runtime]
device            = "cpu"     # cpu | cuda | auto | cpu-fast
accel             = false     # true = auto (CUDA if available, else CPU)
seed              = 0         # random seed (0 = default)
compile_wm        = false     # torch.compile the WM training step (faster, one-time warm-up)
use_kv_cache      = true      # persistent KV-cache for imagined policy rollouts (faster)
pol_eos_lookahead = true      # hindsight (EOS-lookahead) policy supervision
no_smooth         = false     # bypass IIR sensor smoother (use raw snapshots)
